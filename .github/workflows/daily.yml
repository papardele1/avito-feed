name: Обновление фида Авито

on:
  schedule:
    # GitHub запускает расписание с большими задержками и иногда пропускает запуски,
    # особенно ровно в начале часа. Поэтому запускаем часто и не в :00 — лишний запуск безвреден.
    # Утро, когда поставщик обновляет прайс: каждые 20 минут с 10:07 до 12:47 МСК
    - cron: "7,27,47 7,8,9 * * *"
    # Днём ещё раз: 14:17 и 17:17 МСК
    - cron: "17 11,14 * * *"
    # Вечер: переводим окно показа на завтра 10:00–22:00 (22:37 и 23:37 МСК)
    - cron: "37 19,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0 cryptography pillow
      - name: Собрать фид
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
          TG_CHANNEL_INVITE: ${{ secrets.TG_CHANNEL_INVITE }}
        run: python scripts/run_daily.py
      - name: Опубликовать
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/images.json
          git diff --cached --quiet || git commit -m "Фид Авито $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && break; sleep 5; done
