name: Обновление фида Авито

on:
  schedule:
    # 10:00, 11:00 и 12:00 по Москве (UTC+3). GitHub может запускать с задержкой до ~15 минут
    - cron: "0 7,8,9 * * *"
    # 22:30 по Москве: переводим окно показа на завтра 10:00–22:00
    - cron: "30 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0 cryptography pillow
      - name: Собрать фид
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
          TG_CHANNEL_INVITE: ${{ secrets.TG_CHANNEL_INVITE }}
        run: python scripts/run_daily.py
      - name: Опубликовать
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/images.json
          git diff --cached --quiet || git commit -m "Фид Авито $(date -u +%F)"
          git push
