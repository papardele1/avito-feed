name: Выгрузка канала для сравнения
on:
  workflow_dispatch:
    inputs:
      channel: {description: "username канала", required: true}
      limit: {description: "сколько постов", default: "400"}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -U telethon cryptography kurigram tgcrypto-pyrofork || pip install -U telethon cryptography kurigram && python -c "import telethon;print(\"telethon\",telethon.__version__)"
      - run: cd scripts && if [ "${{ github.event.inputs.channel }}" = "probe" ]; then python probe_channel.py; elif [ "${{ github.event.inputs.channel }}" = "kuri" ]; then python probe_kuri.py "${{ github.event.inputs.limit }}"; else python dump_channel.py "${{ github.event.inputs.channel }}" "${{ github.event.inputs.limit }}"; fi
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
