name: Скачать фото товара
on:
  workflow_dispatch:
    inputs:
      name: {description: "имя файла", required: true}
      urls: {description: "ссылки через пробел", required: true}
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/fetch_image.py "${{ github.event.inputs.name }}" ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "avito-feed-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/img; git diff --cached --quiet || (git commit -m "Фото-кандидат" && git pull --rebase -q origin main && git push)
