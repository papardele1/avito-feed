name: Вход в Telegram (один раз)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Оставьте пустым, чтобы получить код. Впишите код из Telegram, чтобы завершить вход"
        required: false

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0 cryptography
      - name: Вход
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
          TG_2FA: ${{ secrets.TG_2FA }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_CODE: ${{ inputs.code }}
        run: |
          if [ -z "${TG_CODE}" ]; then
            python scripts/login.py start
          else
            echo "::add-mask::${TG_CODE}"
            python scripts/login.py finish
          fi
      - name: Сохранить
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Telegram: вход"
          git push
