name: Контроль Авито

on:
  schedule:
    # отчёт автозагрузки: каждый час с 10:20 до 22:20 по Москве
    - cron: "20 7-19 * * *"
    # сводка за день: 21:50 по Москве
    - cron: "50 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "report, summary, upload или full"
        default: "report"

permissions:
  contents: write


jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0 cryptography
      - name: Проверка
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "50 18 * * *" ]; then MODE=summary; else MODE=report; fi
          fi
          python scripts/avito_monitor.py "$MODE"
      - name: Сохранить состояние
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monitor_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Состояние контроля" && git pull --rebase && git push)
