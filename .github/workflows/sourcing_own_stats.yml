name: Avito sourcing — encrypted own-listing stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sourcing_own_stats.yml'
  schedule:
    - cron: '23 3 * * *' # daily 06:23 Moscow; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of completed days (1-365)'
        required: true
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  export-own-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: pip install 'cryptography>=42,<50'
      - name: Export own-listing statistics
        run: python scripts/sourcing_export_avito.py --days "${DAYS}"
        env:
          DAYS: ${{ inputs.days || '30' }}
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
      - name: Encrypt CSV and delete plaintext
        shell: bash
        run: |
          python scripts/sourcing_encrypt_report.py encrypt private_reports/avito_own_stats.csv private_reports/avito_own_stats.csv.enc.json
          rm -f private_reports/avito_own_stats.csv
          test ! -f private_reports/avito_own_stats.csv
      - name: Upload encrypted report only
        uses: actions/upload-artifact@v4
        with:
          name: avito-own-stats-encrypted
          path: private_reports/avito_own_stats.csv.enc.json
          retention-days: 2
          if-no-files-found: error
