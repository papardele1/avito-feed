name: sourcing-verification-unit-tests
on:
  push:
    branches: [feature/sourcing-verified-offers]
  pull_request:
    paths:
      - 'scripts/sourcing_select_verified.py'
      - 'tests/test_sourcing_select_verified.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify seller and compliance gates
        run: python -m unittest discover -s tests -p 'test_sourcing_select_verified.py' -v
